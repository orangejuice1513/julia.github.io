<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music — Julia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="music.css">
</head>
<body class="music-body">

<nav>
  <span class="nav-logo">Julia Jiang</span>
  <ul class="nav-links">
    <li><a href="index.html">HOME</a></li>
    <li><a href="projects.html">PROJECTS</a></li>
    <li><a href="music.html" class="active">MUSIC</a></li>
    <li><a href="contact.html">CONTACT</a></li>
  </ul>
</nav>

<div class="music-page">

  <!-- cherry blossom canopies, built by music.js -->
  <div class="trees" aria-hidden="true"></div>

  <!-- falling petals -->
  <div class="petals" aria-hidden="true"></div>

  <!-- glowberry vines -->
  <div class="vines" aria-hidden="true"></div>

  <div class="content">

    <header class="hero">
      <div class="turntable-stage">
        <div class="turntable">
          <div class="deck">
            <div class="record">
              <div class="label"><span class="spindle"></span></div>
            </div>
            <div class="tonearm"><span class="pivot"></span><span class="headshell"></span></div>
            <span class="knob"></span>
          </div>
        </div>
      </div>

      <h1 class="title">
        <span class="title-solid">Mu</span>
        <span class="title-outline">sic</span>
      </h1>
    </header>

    <section class="lists">
      <div class="column">
        <div class="column-head">
          <h2 class="column-title green">Study Music</h2>
          <span class="rule"></span>
        </div>
        <ul class="links">
          <li><a href="https://www.youtube.com/watch?v=QebXHPY7sac&t=6409s" target="_blank" rel="noopener"><span>lofi</span><span class="tag yt">YouTube</span></a></li>
          <li><a href="https://www.youtube.com/watch?v=eRvtRqNkZww&list=RDeRvtRqNkZww&start_radio=1&t=650s" target="_blank" rel="noopener"><span>ronaldo lava</span><span class="tag yt">YouTube</span></a></li>
          <li><a href="https://www.youtube.com/watch?v=LOFNQH8egc4&list=RDLOFNQH8egc4&start_radio=1" target="_blank" rel="noopener"><span>yoasobi piano</span><span class="tag yt">YouTube</span></a></li>
        </ul>
      </div>

      <div class="column">
        <div class="column-head">
          <h2 class="column-title pink">Current Mood</h2>
          <span class="rule"></span>
        </div>
        <ul class="links">
          <li><a href="#"><span>vodka cranberry</span><span class="tag sp">Spotify</span></a></li>
          <li><a href="#"><span>yoru ni kakeru</span><span class="tag sp">Spotify</span></a></li>
          <li><a href="#"><span>what once was</span><span class="tag yt">Spotify</span></a></li>
          <li><a href="#"><span>casanova</span><span class="tag sp">Spotify</span></a></li>
        </ul>
      </div>
    </section>
  </div>

  <div class="pool">
    <div class="water">
      <span class="shore shore-a"></span>
      <span class="shore shore-b"></span>
      <span class="wave wave-1"></span>
      <span class="wave wave-2"></span>
      <span class="wave wave-3"></span>
      <div class="caustics" aria-hidden="true"></div>
    </div>
    <!-- pixel axolotls, built by music.js -->
    <div class="swimmers" aria-hidden="true"></div>

    <div class="bucket-dock">
      <div class="bucket" role="button" tabindex="0" aria-labelledby="bucket-label"></div>
      <p class="bucket-label" id="bucket-label">click the bucket to scoop one up</p>
    </div>
  </div>

</div>

<script src="music.js"></script>
</body>
</html>
