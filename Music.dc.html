<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./image-slot.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet"></link>
<style>
  body{margin:0}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes flicker{0%,100%{opacity:0.8}50%{opacity:1}}
  @keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
  @keyframes petal{0%{transform:translate(0,-20px) rotate(0deg);opacity:0}10%{opacity:0.9}100%{transform:translate(60px,520px) rotate(220deg);opacity:0}}
  @keyframes wave{0%{transform:translateX(-25%)}100%{transform:translateX(0)}}
  @keyframes shimmer{0%,100%{opacity:0.25;transform:translateX(0) scaleX(1)}50%{opacity:0.6;transform:translateX(16px) scaleX(1.15)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes swim{0%{transform:translateX(-18vw) scaleX(1)}48%{transform:translateX(70vw) scaleX(1)}50%{transform:translateX(70vw) scaleX(-1)}98%{transform:translateX(-18vw) scaleX(-1)}100%{transform:translateX(-18vw) scaleX(1)}}
  a{color:#e3a9c4}
  a:hover{color:#f2b8d4}
</style>
</helmet>

<div style="background:linear-gradient(180deg,#0d120f 0%,#121410 45%,#0e5044 100%);color:#f0ece6;min-height:100vh;font-family:-apple-system,Helvetica,Arial,sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column">

  <sc-for list="{{ trees }}" as="tree" hint-placeholder-count="3">
    <div style="position:absolute;top:{{ tree.top }};left:{{ tree.left }};width:{{ tree.width }};pointer-events:none;opacity:{{ tree.opacity }}">
      <div style="position:relative;height:{{ tree.canopyH }}">
        <sc-for list="{{ tree.blossoms }}" as="b" hint-placeholder-count="6">
          <div style="position:absolute;top:{{ b.top }};left:{{ b.left }};width:{{ b.size }};height:{{ b.size }};border-radius:50%;background:radial-gradient(circle at 40% 35%,{{ b.light }},{{ b.dark }} 75%);filter:blur({{ b.blur }})"></div>
        </sc-for>
      </div>
    </div>
  </sc-for>

  <sc-for list="{{ petals }}" as="p" hint-placeholder-count="6">
    <div style="position:absolute;top:0;left:{{ p.left }};width:{{ p.size }};height:{{ p.size }};border-radius:60% 20% 60% 20%;background:{{ p.color }};animation:petal {{ p.dur }} linear {{ p.delay }} infinite;pointer-events:none"></div>
  </sc-for>

  <sc-for list="{{ vines }}" as="vine" hint-placeholder-count="8">
    <div style="position:absolute;top:0;left:{{ vine.left }};height:{{ vine.height }};width:14px;transform-origin:top center;animation:sway {{ vine.sway }} ease-in-out infinite;pointer-events:none">
      <div style="position:absolute;top:0;left:6px;width:2px;height:100%;background:linear-gradient(180deg,#4a6f3f,#2d4a2a)"></div>
      <sc-for list="{{ vine.leaves }}" as="l" hint-placeholder-count="6">
        <div style="position:absolute;top:{{ l.top }};left:{{ l.left }};width:{{ l.w }};height:{{ l.h }};background:{{ l.color }};border-radius:1px"></div>
      </sc-for>
      <sc-for list="{{ vine.berries }}" as="b" hint-placeholder-count="2">
        <div style="position:absolute;top:{{ b.top }};left:3px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe6a8,#f0a93c 60%,#c9701a);box-shadow:0 0 16px 5px rgba(255,180,80,0.45);animation:flicker {{ b.dur }} ease-in-out infinite"></div>
      </sc-for>
    </div>
  </sc-for>

  <div style="max-width:1100px;margin:0 auto;padding:110px 32px 0;position:relative;z-index:2">

    <header style="display:flex;align-items:center;gap:56px;flex-wrap:wrap;margin-bottom:96px">

      <div style="width:300px;height:280px;flex-shrink:0;perspective:900px;display:flex;align-items:center;justify-content:center">
        <div style="width:260px;height:260px;position:relative;transform-style:preserve-3d;transform:rotateX(52deg) rotateZ(-10deg)">
          <div style="position:absolute;inset:0;padding:22px;box-sizing:border-box;background:linear-gradient(150deg,#332b28,#221c1a);border-radius:14px;box-shadow:0 6px 0 #1b1614,0 12px 0 #151110,0 18px 0 #100d0c,0 26px 34px rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,255,255,0.07);transform-style:preserve-3d">
            <div style="width:100%;height:100%;border-radius:50%;background:repeating-radial-gradient(circle,#2a2522 0px,#2a2522 3px,#151211 4px,#151211 9px);position:relative;animation:spin 8s linear infinite;box-shadow:0 0 0 2px #1a1614,0 6px 12px rgba(0,0,0,0.5)">
              <div style="position:absolute;top:50%;left:50%;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd6e8,#f2b8d4 60%,#dd9bbc);transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,0.35)">
                <div style="width:8px;height:8px;border-radius:50%;background:#151211"></div>
              </div>
            </div>
            <div style="position:absolute;top:14px;right:2px;width:6px;height:104px;background:linear-gradient(90deg,#d8d3ce,#8a8580);border-radius:3px;transform-origin:top center;transform:rotate(26deg) translateZ(14px);box-shadow:0 6px 8px rgba(0,0,0,0.45)">
              <div style="position:absolute;top:-7px;left:-5px;width:16px;height:16px;border-radius:50%;background:linear-gradient(140deg,#e6e1dc,#948e88)"></div>
              <div style="position:absolute;bottom:-4px;left:-3px;width:12px;height:10px;background:#f2b8d4;border-radius:2px"></div>
            </div>
            <div style="position:absolute;bottom:14px;left:16px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8fd4a8,#3f7d59);transform:translateZ(10px);box-shadow:0 4px 6px rgba(0,0,0,0.4)"></div>
          </div>
        </div>
      </div>

      <div>
        <div style="display:flex;flex-direction:column;line-height:0.86">
          <span style="font-size:min(16vw,120px);font-weight:700;letter-spacing:-0.02em;text-transform:uppercase;color:#f2b8d4">Mu</span>
          <span style="font-size:min(16vw,120px);font-weight:700;letter-spacing:-0.02em;text-transform:uppercase;color:transparent;-webkit-text-stroke:2px #f2b8d4;margin-left:0.55em">sic</span>
        </div>
      </div>
    </header>

    <section style="margin-bottom:90px">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:48px">

        <div>
          <div style="display:flex;align-items:center;gap:16px;margin-bottom:32px">
            <div style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.15em;color:#9fc79a;font-weight:300;text-transform:uppercase">Study Music</div>
            <div style="flex:1;height:1px;background:#2a2724"></div>
          </div>
          <div style="display:flex;flex-direction:column;gap:12px">
            <sc-for list="{{ study }}" as="link" hint-placeholder-count="6">
              <a href="{{ link.href }}" style="display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:'Pixelify Sans',monospace;font-size:19px;color:#f0ece6;text-decoration:none;padding-bottom:12px;border-bottom:1px solid #26231f">
                <span>{{ link.title }}</span>
                <span style="font-family:'Pixelify Sans',monospace;font-size:13px;letter-spacing:0.04em;color:{{ link.tagColor }};background:{{ link.tagBg }};border:2px solid {{ link.tagColor }};border-radius:0;padding:2px 8px;flex-shrink:0;text-transform:uppercase;box-shadow:3px 3px 0 rgba(0,0,0,0.45);line-height:1.3">{{ link.source }}</span>
              </a>
            </sc-for>
          </div>
        </div>

        <div>
          <div style="display:flex;align-items:center;gap:16px;margin-bottom:32px">
            <div style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.15em;color:#f2b8d4;font-weight:300;text-transform:uppercase">Current Mood</div>
            <div style="flex:1;height:1px;background:#2a2724"></div>
          </div>
          <div style="display:flex;flex-direction:column;gap:12px">
            <sc-for list="{{ chill }}" as="link" hint-placeholder-count="4">
              <a href="{{ link.href }}" style="display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:'Pixelify Sans',monospace;font-size:19px;color:#f0ece6;text-decoration:none;padding-bottom:12px;border-bottom:1px solid #26231f">
                <span>{{ link.title }}</span>
                <span style="font-family:'Pixelify Sans',monospace;font-size:13px;letter-spacing:0.04em;color:{{ link.tagColor }};background:{{ link.tagBg }};border:2px solid {{ link.tagColor }};border-radius:0;padding:2px 8px;flex-shrink:0;text-transform:uppercase;box-shadow:3px 3px 0 rgba(0,0,0,0.45);line-height:1.3">{{ link.source }}</span>
              </a>
            </sc-for>
          </div>
        </div>

      </div>
    </section>
  </div>

  <div style="position:relative;z-index:2;flex:1 0 340px;min-height:340px;margin-top:30px">

    <div style="position:absolute;top:0;left:-6%;width:112%;height:100%;border-radius:38% 64% 0 0 / 120px 60px 0 0;background:linear-gradient(180deg,rgba(168,238,190,0.34) 0%,rgba(92,200,160,0.44) 20%,rgba(38,148,118,0.58) 50%,rgba(14,80,62,0.8) 100%);overflow:hidden">

      <div style="position:absolute;top:-40px;left:8%;width:38%;height:130px;border-radius:50%;background:rgba(150,225,180,0.3)"></div>
      <div style="position:absolute;top:-26px;right:4%;width:30%;height:100px;border-radius:50%;background:rgba(130,215,170,0.26)"></div>

      <div style="position:absolute;top:-14px;left:0;width:160%;height:34px;border-radius:50%;background:rgba(205,255,215,0.32);filter:blur(3px);animation:wave 9s linear infinite"></div>
      <div style="position:absolute;top:6px;left:0;width:160%;height:26px;border-radius:50%;background:rgba(175,245,200,0.2);filter:blur(3px);animation:wave 13s linear infinite reverse"></div>
      <div style="position:absolute;top:34px;left:0;width:160%;height:20px;border-radius:50%;background:rgba(140,230,185,0.14);filter:blur(4px);animation:wave 17s linear infinite"></div>

      <sc-for list="{{ caustics }}" as="c" hint-placeholder-count="7">
        <div style="position:absolute;top:{{ c.top }};left:{{ c.left }};width:{{ c.w }};height:{{ c.h }};border-radius:50%;background:rgba(230,255,230,0.45);filter:blur(2px);animation:shimmer {{ c.dur }} ease-in-out infinite"></div>
      </sc-for>
    </div>

    <div style="position:absolute;top:120px;left:0;width:100%;height:150px;pointer-events:none">
      <sc-for list="{{ axolotls }}" as="lotl" hint-placeholder-count="2">
        <div style="position:absolute;top:{{ lotl.top }};left:0;animation:swim {{ lotl.dur }} linear {{ lotl.delay }} infinite">
          <div style="animation:bob {{ lotl.bob }} ease-in-out infinite">
            <div style="display:grid;grid-template-columns:repeat(24,{{ lotl.px }});line-height:0;filter:drop-shadow(0 6px 10px rgba(0,40,35,0.35))">
              <sc-for list="{{ lotl.pixels }}" as="cell" hint-placeholder-count="48">
                <div style="width:{{ lotl.px }};height:{{ lotl.px }};background:{{ cell.color }}"></div>
              </sc-for>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="position:absolute;bottom:12px;left:24px;z-index:3">
      <div onClick="{{ toggleBucket }}" style="display:grid;grid-template-columns:repeat(12,6px);line-height:0;cursor:pointer;opacity:0.85;filter:drop-shadow(0 4px 8px rgba(0,40,35,0.45))">
        <sc-for list="{{ bucketPixels }}" as="cell" hint-placeholder-count="60">
          <div style="width:6px;height:6px;background:{{ cell.color }}"></div>
        </sc-for>
      </div>
    </div>

  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { caught: false };
  renderVals() {
    const greens = ['#4f7a45', '#5d8c4d', '#3f6638'];
    const mkVine = (left, height, sway, berryTops) => {
      const leaves = [];
      let n = 0;
      for (let y = 18; y < height - 10; y += 22) {
        const side = n % 2 === 0;
        leaves.push({ top: y + 'px', left: side ? '9px' : '0px', w: side ? '7px' : '6px', h: '5px', color: greens[n % 3] });
        n++;
      }
      return { left, height: height + 'px', sway, leaves, berries: berryTops.map((t, i) => ({ top: t + 'px', dur: (2.6 + i * 0.5) + 's' })) };
    };
    const mkTree = (left, top, width, opacity, tone, trunkH) => {
      const light = tone === 'deep' ? '#f7a7c8' : '#ffd3e4';
      const dark = tone === 'deep' ? '#d1719b' : '#f0a2c3';
      return {
        left, top, width: width + 'px', opacity,
        canopyH: Math.round(width * 0.62) + 'px',
        trunkW: Math.max(10, Math.round(width * 0.05)) + 'px',
        trunkH: trunkH + 'px',
        blossoms: [
          { top: '0px', left: '18%', size: '46%', light, dark, blur: '2px' },
          { top: '12%', left: '0%', size: '40%', light, dark, blur: '3px' },
          { top: '10%', left: '52%', size: '44%', light, dark, blur: '3px' },
          { top: '34%', left: '14%', size: '38%', light, dark, blur: '2px' },
          { top: '36%', left: '48%', size: '40%', light, dark, blur: '3px' },
          { top: '26%', left: '30%', size: '42%', light, dark, blur: '1px' },
        ],
      };
    };
    const art = [
      '.........g.g.g..........',
      '........GGGGGGG.........',
      '.........GGGGG..........',
      '...F......PPPPPPPPPP....',
      '..FF....PPPPPPPPPPPPPP..',
      '..FFPPPPPPPPPPPPPEEPPPP.',
      '.FFFPPPPPPPPPPPPWEEPPPPP',
      'FFFFLLLLLLLLLLLLLLLLLPPD',
      'FFFFLLLLLLLLLLLLLLLLLLDD',
      '.FFFLLLLLLLLLLLLLLLLLD..',
      '..FF..PPP.....PPP...D...',
    ];
    const pinkPal = { P: '#f6b3d0', L: '#ffe0ee', F: '#eda3c6', D: '#c9749d', G: '#ff92c2', g: '#e56ba3' };
    const bluePal = { P: '#a8cdf2', L: '#dfeeff', F: '#93bde8', D: '#6a8fbd', G: '#8fc4ff', g: '#6b9ad9' };
    const shared = { E: '#2b1b22', W: '#ffffff', S: '#b9c2c8', s: '#7d878e', i: '#4d5a62', A: '#58c8c0', '.': 'transparent' };
    const paint = { ...pinkPal, ...shared };
    const sprite = (pal) => {
      const map = { ...pal, ...shared };
      const out = [];
      art.forEach((row) => row.split('').forEach((ch) => out.push({ color: map[ch] })));
      return out;
    };

    const bucketEmpty = [
      '.SSSSSSSSSS.',
      '.SiiiiiiiiS.',
      '.SiiiiiiiiS.',
      '.SiiiiiiiiS.',
      '.SiiiiiiiiS.',
      '..SiiiiiiS..',
      '..SiiiiiiS..',
      '..SiiiiiiS..',
      '...SssssS...',
      '...SSSSSS...',
    ];
    const bucketFull = [
      '.SSSSSSSSSS.',
      '.SAAGAGAAAS.',
      '.SAGPPPPGAS.',
      '.SAAPEPPAAS.',
      '.SAAPPPPAAS.',
      '..SAAAAAAS..',
      '..SAAAAAAS..',
      '..SAAAAAAS..',
      '...SssssS...',
      '...SSSSSS...',
    ];
    const caught = this.state.caught;
    const bucketPixels = [];
    (caught ? bucketFull : bucketEmpty).forEach((row) => row.split('').forEach((ch) => bucketPixels.push({ color: paint[ch] })));

    const swimmers = [
      { top: '0px', px: '9px', dur: '26s', delay: '0s', bob: '3.2s', pixels: sprite(pinkPal) },
      { top: '96px', px: '7px', dur: '34s', delay: '6s', bob: '4.1s', pixels: sprite(bluePal) },
    ];

    return {
      trees: [mkTree('-6%', '-90px', 380, 0.8, 'deep', 900), mkTree('68%', '-120px', 440, 0.7, 'soft', 980), mkTree('34%', '-160px', 300, 0.5, 'deep', 1020)],
      petals: [
        { left: '12%', size: '7px', color: '#f7c3da', dur: '11s', delay: '0s' },
        { left: '28%', size: '6px', color: '#eba9c6', dur: '14s', delay: '2s' },
        { left: '47%', size: '8px', color: '#f7c3da', dur: '12s', delay: '5s' },
        { left: '63%', size: '6px', color: '#eba9c6', dur: '15s', delay: '1s' },
        { left: '78%', size: '7px', color: '#f7c3da', dur: '13s', delay: '7s' },
        { left: '90%', size: '6px', color: '#eba9c6', dur: '16s', delay: '3s' },
      ],
      vines: [
        mkVine('3%', 320, '7s', [110, 250]),
        mkVine('9%', 190, '6s', [80]),
        mkVine('15%', 420, '8.5s', [140, 300, 390]),
        mkVine('23%', 150, '6.5s', [60]),
        mkVine('57%', 240, '7.5s', [90, 200]),
        mkVine('73%', 175, '6.2s', [120]),
        mkVine('86%', 370, '8.2s', [130, 280]),
        mkVine('95%', 220, '7.8s', [95, 185]),
      ],
      caustics: [
        { top: '70px', left: '10%', w: '90px', h: '5px', dur: '5s' },
        { top: '120px', left: '26%', w: '60px', h: '4px', dur: '6.5s' },
        { top: '95px', left: '48%', w: '110px', h: '5px', dur: '7s' },
        { top: '165px', left: '18%', w: '70px', h: '4px', dur: '5.8s' },
        { top: '140px', left: '66%', w: '95px', h: '5px', dur: '6.2s' },
        { top: '205px', left: '40%', w: '80px', h: '4px', dur: '7.4s' },
        { top: '190px', left: '78%', w: '65px', h: '4px', dur: '5.4s' },
      ],
      bucketPixels,
      bucketLabel: caught ? 'bucket of axolotl — click to release' : 'click the bucket to scoop one up',
      toggleBucket: () => this.setState((s) => ({ caught: !s.caught })),
      axolotls: caught ? swimmers.slice(1) : swimmers,
      study: [
        { title: 'lofi hip hop radio', href: '#', source: 'YouTube', tagColor: '#9fc79a', tagBg: 'rgba(60,96,58,0.35)' },
        { title: 'deep focus', href: '#', source: 'Spotify', tagColor: '#f2b8d4', tagBg: 'rgba(120,60,88,0.3)' },
        { title: 'late night lofi loop', href: '#', source: 'YouTube', tagColor: '#9fc79a', tagBg: 'rgba(60,96,58,0.35)' },
        { title: 'chopin for studying', href: '#', source: 'YouTube', tagColor: '#9fc79a', tagBg: 'rgba(60,96,58,0.35)' },
        { title: 'piano & rain', href: '#', source: 'Spotify', tagColor: '#f2b8d4', tagBg: 'rgba(120,60,88,0.3)' },
        { title: 'brown noise + pad', href: '#', source: 'YouTube', tagColor: '#9fc79a', tagBg: 'rgba(60,96,58,0.35)' },
      ],
      chill: [
        { title: 'sunday morning mix', href: '#', source: 'Spotify', tagColor: '#f2b8d4', tagBg: 'rgba(120,60,88,0.3)' },
        { title: 'late night drive', href: '#', source: 'Spotify', tagColor: '#f2b8d4', tagBg: 'rgba(120,60,88,0.3)' },
        { title: 'coffee shop ambience', href: '#', source: 'YouTube', tagColor: '#9fc79a', tagBg: 'rgba(60,96,58,0.35)' },
        { title: 'random mood songs', href: '#', source: 'Spotify', tagColor: '#f2b8d4', tagBg: 'rgba(120,60,88,0.3)' },
      ],
    };
  }
}
</script>
</body>
</html>
